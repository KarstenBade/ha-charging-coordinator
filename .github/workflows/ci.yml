name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component "pymodbus>=3.10" ruff mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Bundled card is up to date
        run: git diff --exit-code custom_components/charging_coordinator/www/

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
